/* ---------- tokens ---------- */
:root{
  --ground:#171A15;        /* charcoal, faint olive bias — a cast-iron evening */
  --raised:#20241D;
  --sunken:#101310;
  --line:#2F3429;
  --line-soft:#242820;
  --text-1:#F0EDE3;
  --text-2:#A5AA97;
  --text-3:#767B6B;
  --accent:#E8A33D;        /* saffron */
  --accent-ink:#191C13;
  --accent-soft:rgba(232,163,61,.14);
  --danger:#D9705F;
  --sheet-veil:rgba(10,12,9,.62);
  --hub-face:#F0EDE3;
  --hub-ink:#191C13;
  --rim-1:#3A4032;
  --rim-2:#12140F;
  --shadow-wheel:0 18px 46px rgba(0,0,0,.55);
  --seg-stroke:rgba(23,26,21,.55);
  --seg-dim:rgba(16,19,14,.6);

  --display:'FrankRuhl',"Frank Ruhl Libre",'Times New Roman',serif;
  --ui:'Heebo',-apple-system,'Segoe UI','Noto Sans Hebrew','Arial Hebrew',sans-serif;

  --step--1:clamp(.72rem,.68rem + .2vw,.8rem);
  --step-0:clamp(.94rem,.9rem + .25vw,1.02rem);
  --step-1:clamp(1.1rem,1rem + .5vw,1.25rem);
  --step-2:clamp(1.6rem,1.25rem + 1.9vw,2.3rem);
  --step-3:clamp(2rem,1.4rem + 3.4vw,3.1rem);
}
@media (prefers-color-scheme:light){
  :root{
    --ground:#FBFAF6;
    --raised:#FFFFFF;
    --sunken:#F1F0E9;
    --line:#E0DFD4;
    --line-soft:#EBEAE1;
    --text-1:#1C1F18;
    --text-2:#61675A;
    --text-3:#8B9082;
    --accent:#B87614;
    --accent-ink:#FFFFFF;
    --accent-soft:rgba(184,118,20,.1);
    --danger:#B44A38;
    --sheet-veil:rgba(28,31,24,.4);
    --hub-face:#1C1F18;
    --hub-ink:#FBFAF6;
    --rim-1:#F0EEE4;
    --rim-2:#C4C2B4;
    --shadow-wheel:0 16px 38px rgba(40,44,32,.18);
    --seg-stroke:rgba(255,255,255,.5);
    --seg-dim:rgba(251,250,246,.68);
  }
}
:root[data-theme="light"]{
  --ground:#FBFAF6; --raised:#FFFFFF; --sunken:#F1F0E9; --line:#E0DFD4; --line-soft:#EBEAE1;
  --text-1:#1C1F18; --text-2:#61675A; --text-3:#8B9082;
  --accent:#B87614; --accent-ink:#FFFFFF; --accent-soft:rgba(184,118,20,.1); --danger:#B44A38;
  --sheet-veil:rgba(28,31,24,.4); --hub-face:#1C1F18; --hub-ink:#FBFAF6;
  --rim-1:#F0EEE4; --rim-2:#C4C2B4; --shadow-wheel:0 16px 38px rgba(40,44,32,.18);
  --seg-stroke:rgba(255,255,255,.5); --seg-dim:rgba(251,250,246,.68);
}
:root[data-theme="dark"]{
  --ground:#171A15; --raised:#20241D; --sunken:#101310; --line:#2F3429; --line-soft:#242820;
  --text-1:#F0EDE3; --text-2:#A5AA97; --text-3:#767B6B;
  --accent:#E8A33D; --accent-ink:#191C13; --accent-soft:rgba(232,163,61,.14); --danger:#D9705F;
  --sheet-veil:rgba(10,12,9,.62); --hub-face:#F0EDE3; --hub-ink:#191C13;
  --rim-1:#3A4032; --rim-2:#12140F; --shadow-wheel:0 18px 46px rgba(0,0,0,.55);
  --seg-stroke:rgba(23,26,21,.55); --seg-dim:rgba(16,19,14,.6);
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  direction:rtl;
  background:var(--ground);
  color:var(--text-1);
  font-family:var(--ui);
  font-size:var(--step-0);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  overscroll-behavior-y:none;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* ---------- shell ---------- */
.app{
  direction:rtl;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  gap:clamp(10px,2.4vw,20px);
  padding:calc(env(safe-area-inset-top) + 18px) clamp(14px,4vw,22px) calc(env(safe-area-inset-bottom) + 16px);
  max-width:560px;
  margin-inline:auto;
}

/* ---------- header ---------- */
.masthead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.eyebrow{
  font-size:var(--step--1);font-weight:700;letter-spacing:.16em;
  color:var(--text-3);margin:0 0 2px;
}
.title{
  font-family:var(--display);
  font-weight:800;
  font-size:var(--step-2);
  line-height:1.04;
  letter-spacing:-.01em;
  margin:0;
  text-wrap:balance;
}
.title em{font-style:normal;color:var(--accent)}
.ghost-btn{
  flex:none;width:38px;height:38px;border-radius:11px;
  border:1px solid var(--line);background:var(--raised);
  display:grid;place-items:center;color:var(--text-2);
  transition:color .18s,border-color .18s;
}
.ghost-btn:hover{color:var(--text-1);border-color:var(--text-3)}
.ghost-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.ghost-btn .off{display:none}
.ghost-btn[aria-pressed="true"] .on{display:none}
.ghost-btn[aria-pressed="true"] .off{display:block}

/* ---------- wheel ---------- */
.stage{
  position:relative;
  display:grid;
  place-items:center;
  padding-block:4px;
}
.wheel-wrap{
  position:relative;
  width:min(88vw,404px);
  aspect-ratio:1;
  filter:drop-shadow(var(--shadow-wheel));
}
canvas#wheel{
  width:100%;height:100%;display:block;border-radius:50%;
  touch-action:manipulation;
}
.hub{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:27%;aspect-ratio:1;border-radius:50%;
  background:var(--hub-face);color:var(--hub-ink);
  display:grid;place-items:center;
  font-family:var(--display);font-weight:800;
  font-size:clamp(1rem,4.4vw,1.4rem);
  letter-spacing:.02em;
  box-shadow:0 0 0 4px var(--ground),0 6px 18px rgba(0,0,0,.35);
  transition:transform .16s cubic-bezier(.3,1.4,.5,1),opacity .2s;
}
.hub:active{transform:translate(-50%,-50%) scale(.94)}
.hub[disabled]{opacity:.4;cursor:default}
.hub[disabled]:active{transform:translate(-50%,-50%)}
.hub small{display:block;font-family:var(--ui);font-weight:600;font-size:.5em;opacity:.55;letter-spacing:.08em;margin-top:.1em}

/* the ticker peg that the segments flick past */
.peg{
  position:absolute;top:-9px;left:50%;
  width:26px;height:40px;margin-inline-start:-13px;
  transform-origin:50% 12%;
  transition:transform .13s cubic-bezier(.2,1.5,.4,1);
  pointer-events:none;
  z-index:2;
}
.peg svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.peg.flick{transform:rotate(-19deg)}

.empty-hint{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  z-index:3;
  max-width:76%;
  text-align:center;
  color:var(--text-2);font-size:var(--step--1);line-height:1.55;
  background:var(--ground);
  border:1px solid var(--line);
  border-radius:15px;
  padding:13px 17px;
  margin:0;
  pointer-events:none;
}
.empty-hint[hidden]{display:none}
/* with fewer than two dishes there is nothing to spin, so the hub steps aside */
.wheel-wrap.bare .hub{visibility:hidden}

/* ---------- meta strip ---------- */
.strip{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:22px;
  font-size:var(--step--1);color:var(--text-3);
}
.count{font-variant-numeric:tabular-nums;letter-spacing:.04em}
.recent{
  display:flex;gap:6px;align-items:center;min-width:0;
}
.recent span{
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--text-2);
}
.recent b{color:var(--text-3);font-weight:600;letter-spacing:.1em}

/* ---------- composer ---------- */
.composer{display:flex;gap:8px}
.composer input{
  flex:1;min-width:0;
  background:var(--raised);
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px 15px;
  transition:border-color .18s;
}
.composer input::placeholder{color:var(--text-3)}
.composer input:focus{outline:none;border-color:var(--accent)}
.add{
  flex:none;padding-inline:20px;border-radius:13px;
  background:var(--accent);color:var(--accent-ink);
  font-weight:800;letter-spacing:.02em;
  transition:filter .18s,transform .1s;
}
.add:hover{filter:brightness(1.06)}
.add:active{transform:scale(.97)}

/* ---------- dish list ---------- */
.dishes{
  list-style:none;margin:0;padding:0;
  display:flex;flex-wrap:wrap;gap:7px;
  align-content:flex-start;
}
.dish{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--raised);
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 12px 6px 6px;
  font-size:var(--step--1);
  animation:pop .22s cubic-bezier(.2,1.4,.4,1);
}
.dish .swatch{width:9px;height:9px;border-radius:50%;flex:none}
.dish .kill{
  width:20px;height:20px;border-radius:50%;
  display:grid;place-items:center;
  color:var(--text-3);font-size:15px;line-height:1;
  transition:background .16s,color .16s;
}
.dish .kill:hover{background:var(--sunken);color:var(--danger)}
@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}

.tools{display:flex;gap:16px;padding-top:2px}
.tools button{
  font-size:var(--step--1);color:var(--text-3);font-weight:600;
  padding:4px 0;transition:color .16s;
}
.tools button:hover{color:var(--text-1)}
.tools .wipe:hover{color:var(--danger)}

/* ---------- result sheet ---------- */
.veil{
  position:fixed;inset:0;background:var(--sheet-veil);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .3s;z-index:20;
}
.veil.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;inset-inline:0;bottom:0;z-index:21;
  background:var(--raised);
  border-top:1px solid var(--line);
  border-radius:26px 26px 0 0;
  padding:22px clamp(18px,5vw,26px) calc(env(safe-area-inset-bottom) + 20px);
  max-width:560px;margin-inline:auto;
  transform:translateY(102%);
  transition:transform .38s cubic-bezier(.22,1,.3,1);
  box-shadow:0 -12px 40px rgba(0,0,0,.3);
}
.sheet.open{transform:translateY(0)}
.grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.verdict-label{
  font-size:var(--step--1);font-weight:700;letter-spacing:.16em;
  color:var(--text-3);margin:0 0 6px;
}
.verdict{
  font-family:var(--display);font-weight:800;
  font-size:var(--step-3);line-height:1.06;margin:0 0 4px;
  text-wrap:balance;
}
.verdict-rule{height:3px;width:52px;border-radius:2px;margin:14px 0 18px}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet-actions button{
  padding:13px 10px;border-radius:13px;font-weight:700;
  border:1px solid var(--line);color:var(--text-1);
  background:var(--ground);
  transition:border-color .16s,color .16s;
}
.sheet-actions button:hover{border-color:var(--text-3)}
.sheet-actions .primary{
  grid-column:1 / -1;
  background:var(--accent);color:var(--accent-ink);border-color:transparent;
}
.sheet-actions .primary:hover{filter:brightness(1.06)}
.sheet-actions .drop:hover{color:var(--danger);border-color:var(--danger)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.05ms !important}
}
</style>
</head>
<body>
<div class="app" dir="rtl">

  <header class="masthead">
    <div>
      <p class="eyebrow">גלגל ארוחת הערב</p>
      <h1 class="title">מה אוכלים <em>הערב?</em></h1>
    </div>
    <button class="ghost-btn" id="sound" type="button" aria-pressed="false" aria-label="כיבוי והדלקת צליל">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9.5h3l4-3.5v12l-4-3.5H5z"/><path d="M16 9c1 .9 1 5.1 0 6"/><path d="M18.5 6.5c2.2 2 2.2 9 0 11"/></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9.5h3l4-3.5v12l-4-3.5H5z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
  </header>

  <div class="stage">
    <div class="wheel-wrap">
      <canvas id="wheel" role="img" aria-label="גלגל המנות"></canvas>
      <div class="peg" id="peg" aria-hidden="true">
        <svg viewBox="0 0 26 40"><path d="M13 40 3 12a10 10 0 1 1 20 0z" fill="var(--accent)"/><circle cx="13" cy="11" r="3.6" fill="var(--ground)"/></svg>
      </div>
      <p class="empty-hint" id="emptyHint" hidden>הוסיפו לפחות שתי מנות<br>והגלגל יחליט במקומכם</p>
      <button class="hub" id="spin" type="button">סובב<small>הערב</small></button>
    </div>
  </div>

  <div class="strip">
    <span class="count" id="count"></span>
    <span class="recent" id="recent"></span>
  </div>

  <form class="composer" id="composer">
    <input id="dishInput" type="text" inputmode="text" autocomplete="off"
           enterkeyhint="done" maxlength="28" placeholder="הוסיפו מנה — שקשוקה, פסטה…"
           aria-label="שם המנה">
    <button class="add" type="submit">הוספה</button>
  </form>

  <ul class="dishes" id="dishes"></ul>

  <div class="tools">
    <button type="button" id="shuffle">ערבוב הגלגל</button>
    <button type="button" id="restore">רשימת פתיחה</button>
    <button type="button" class="wipe" id="wipe">ניקוי הכל</button>
  </div>

</div>

<div class="veil" id="veil"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="verdict" aria-hidden="true">
  <div class="grip"></div>
  <p class="verdict-label">הערב אוכלים</p>
  <h2 class="verdict" id="verdict" aria-live="polite"></h2>
  <div class="verdict-rule" id="verdictRule"></div>
  <div class="sheet-actions">
    <button class="primary" type="button" id="accept">סגור — זה מה שאוכלים</button>
    <button type="button" id="again">עוד סיבוב</button>
    <button class="drop" type="button" id="drop">להוריד מהרשימה</button>
  </div>
</section>

<script>
(function(){
  "use strict";

  /* ---- spice-market segment palette (constant across themes) ---- */
  var PALETTE = [
    {fill:'#E8A33D', ink:'#1B1D16'}, /* saffron  */
    {fill:'#B8382E', ink:'#FFF6F2'}, /* sumac    */
    {fill:'#6E8B4A', ink:'#F7FAF1'}, /* za'atar  */
    {fill:'#6D4B72', ink:'#FBF4FC'}, /* eggplant */
    {fill:'#CDB88C', ink:'#241F13'}, /* tahini   */
    {fill:'#D4622C', ink:'#FFF6F1'}, /* harissa  */
    {fill:'#3E8F7C', ink:'#F1FBF8'}, /* mint     */
    {fill:'#7A4B25', ink:'#FBF2EA'}  /* silan    */
  ];

  var STARTER = ['שקשוקה','פסטה ברוטב עגבניות','חומוס וסלטים','פיצה','סלט גדול עם ביצה','קציצות ופירה','מרק עדשים','אורז וירקות בתנור'];
  var MAX = 16;
  var KEY = 'dinner-wheel:v1';

  var $ = function(id){ return document.getElementById(id); };
  var canvas = $('wheel'), ctx = canvas.getContext('2d');
  var peg = $('peg'), spinBtn = $('spin'), hint = $('emptyHint');
  var listEl = $('dishes'), countEl = $('count'), recentEl = $('recent');
  var sheet = $('sheet'), veil = $('veil'), verdict = $('verdict'), verdictRule = $('verdictRule');

  var dishes = [];
  var recent = [];
  var rot = -Math.PI / 2 + 0.13;   /* resting angle, slightly off so it never looks machine-set */
  var spinning = false;
  var winner = -1;
  var soundOn = true;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------- storage ---------------- */
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var data = JSON.parse(raw);
        if(Array.isArray(data.dishes)) dishes = data.dishes.slice(0, MAX);
        if(Array.isArray(data.recent)) recent = data.recent.slice(0, 3);
        if(typeof data.sound === 'boolean') soundOn = data.sound;
        return;
      }
    }catch(e){}
    dishes = STARTER.slice();
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({dishes:dishes, recent:recent, sound:soundOn}));
    }catch(e){}
  }

  /* ---------------- audio: a dry wooden tick, synthesised ---------------- */
  var actx = null;
  function tick(){
    if(!soundOn) return;
    try{
      if(!actx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return;
        actx = new AC();
      }
      if(actx.state === 'suspended') actx.resume();
      var t = actx.currentTime;
      var osc = actx.createOscillator(), gain = actx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(880, t);
      osc.frequency.exponentialRampToValueAtTime(220, t + 0.045);
      gain.gain.setValueAtTime(0.14, t);
      gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.055);
      osc.connect(gain).connect(actx.destination);
      osc.start(t); osc.stop(t + 0.06);
    }catch(e){}
  }
  function chord(){
    if(!soundOn || !actx) return;
    try{
      [523.25, 659.25, 783.99].forEach(function(f, i){
        var t = actx.currentTime + i * 0.055;
        var osc = actx.createOscillator(), gain = actx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.13, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.5);
        osc.connect(gain).connect(actx.destination);
        osc.start(t); osc.stop(t + 0.55);
      });
    }catch(e){}
  }
  function buzz(ms){
    if(navigator.vibrate){ try{ navigator.vibrate(ms); }catch(e){} }
  }

  /* ---------------- wheel drawing ---------------- */
  var size = 0, R = 0;
  function resize(){
    var rect = canvas.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    size = Math.max(rect.width, 1);
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = size / 2;
    draw();
  }

  function fit(text, maxWidth){
    if(ctx.measureText(text).width <= maxWidth) return text;
    var s = text;
    while(s.length > 1 && ctx.measureText(s + '…').width > maxWidth) s = s.slice(0, -1);
    return s + '…';
  }

  function draw(){
    ctx.clearRect(0, 0, size, size);
    var n = dishes.length;
    var cx = R, cy = R;
    var rim = Math.max(6, R * 0.035);
    var outer = R - rim / 2;

    if(n === 0){
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, outer - 2, 0, Math.PI * 2);
      ctx.setLineDash([7, 9]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = cssVar('--line');
      ctx.stroke();
      ctx.restore();
      return;
    }

    var seg = (Math.PI * 2) / n;
    var fontSize = Math.max(10, Math.min(R * 0.093, 21) * (n > 10 ? 0.86 : 1));
    ctx.textBaseline = 'middle';
    ctx.direction = 'rtl';

    for(var i = 0; i < n; i++){
      var a0 = rot + i * seg, a1 = a0 + seg;
      var c = PALETTE[i % PALETTE.length];

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, outer, a0, a1);
      ctx.closePath();
      ctx.fillStyle = c.fill;
      ctx.fill();

      /* depth: the rim edge of every slice sits a touch darker */
      var g = ctx.createRadialGradient(cx, cy, outer * 0.45, cx, cy, outer);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,.17)');
      ctx.fillStyle = g;
      ctx.fill();

      if(n > 1){
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = cssVar('--seg-stroke');
        ctx.stroke();
      }

      /* the winning slice keeps its colour, the rest step back */
      if(winner > -1 && i !== winner){
        ctx.fillStyle = cssVar('--seg-dim');
        ctx.fill();
      }

      ctx.save();
      ctx.translate(cx, cy);
      var mid = a0 + seg / 2;
      var flipped = Math.cos(mid) < 0;
      ctx.rotate(flipped ? mid + Math.PI : mid);
      ctx.fillStyle = c.ink;
      if(winner > -1 && i !== winner) ctx.globalAlpha = 0.5;
      var hub = R * 0.325;                       /* the hub cap plus its ring */
      var room = outer - hub - fontSize * 0.9;
      /* a long name shrinks a little before it gets cut */
      var fs = fontSize;
      ctx.font = '700 ' + fs.toFixed(1) + 'px ' + uiFontStack();
      while(fs > fontSize * 0.76 && ctx.measureText(dishes[i]).width > room){
        fs -= 0.6;
        ctx.font = '700 ' + fs.toFixed(1) + 'px ' + uiFontStack();
      }
      var label = fit(dishes[i], room);
      if(flipped){
        ctx.textAlign = 'left';
        ctx.fillText(label, -(outer - fs * 0.75), 0);
      }else{
        ctx.textAlign = 'right';
        ctx.fillText(label, outer - fs * 0.75, 0);
      }
      ctx.restore();
    }

    /* rim */
    var rg = ctx.createLinearGradient(0, 0, 0, size);
    rg.addColorStop(0, cssVar('--rim-1'));
    rg.addColorStop(1, cssVar('--rim-2'));
    ctx.beginPath();
    ctx.arc(cx, cy, outer, 0, Math.PI * 2);
    ctx.lineWidth = rim;
    ctx.strokeStyle = rg;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, outer - rim / 2 - 1, 0, Math.PI * 2);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(232,163,61,.5)';
    ctx.stroke();
  }

  var probe = null;
  function cssVar(name){
    if(!probe) probe = getComputedStyle(document.documentElement);
    return probe.getPropertyValue(name).trim() || '#888';
  }
  function uiFontStack(){
    return "'Heebo', -apple-system, 'Noto Sans Hebrew', 'Arial Hebrew', sans-serif";
  }

  /* ---------------- spinning ---------------- */
  function indexAtPointer(){
    var n = dishes.length;
    if(!n) return -1;
    var seg = (Math.PI * 2) / n;
    var pointer = -Math.PI / 2;                 /* 12 o'clock */
    var rel = ((pointer - rot) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    return Math.floor(rel / seg) % n;
  }

  function spin(){
    if(spinning || dishes.length < 2) return;
    spinning = true;
    winner = -1;
    spinBtn.disabled = true;
    if(actx && actx.state === 'suspended') actx.resume();

    var n = dishes.length;
    var seg = (Math.PI * 2) / n;
    var pick = Math.floor(Math.random() * n);
    /* land the chosen slice under the pointer, with jitter so it never stops dead-centre */
    var jitter = (Math.random() * 0.72 + 0.14) * seg;
    var target = -Math.PI / 2 - pick * seg - jitter;
    var turns = 5 + Math.floor(Math.random() * 3);
    var from = rot;
    var delta = turns * Math.PI * 2 + (((target - from) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    var dur = reduced ? 500 : 4200 + Math.random() * 900;
    var start = performance.now();
    var lastIdx = indexAtPointer();

    function frame(now){
      var t = Math.min((now - start) / dur, 1);
      var e = 1 - Math.pow(1 - t, 4);
      rot = from + delta * e;
      var idx = indexAtPointer();
      if(idx !== lastIdx){
        lastIdx = idx;
        if(!reduced){
          tick();
          buzz(6);
          peg.classList.add('flick');
          setTimeout(function(){ peg.classList.remove('flick'); }, 70);
        }
      }
      draw();
      if(t < 1){
        requestAnimationFrame(frame);
      }else{
        rot = ((from + delta) % (Math.PI * 2));
        spinning = false;
        spinBtn.disabled = false;
        winner = indexAtPointer();
        draw();
        reveal(winner);
      }
    }
    requestAnimationFrame(frame);
  }

  /* ---------------- result sheet ---------------- */
  var lastFocus = null;
  function reveal(i){
    if(i < 0 || i >= dishes.length) return;
    var name = dishes[i];
    verdict.textContent = name;
    verdictRule.style.background = PALETTE[i % PALETTE.length].fill;
    lastFocus = document.activeElement;
    veil.classList.add('open');
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
    buzz([0, 26, 60, 26]);
    chord();
    recent = [name].concat(recent.filter(function(r){ return r !== name; })).slice(0, 3);
    renderRecent();
    save();
    setTimeout(function(){ $('accept').focus(); }, 380);
  }
  function closeSheet(){
    veil.classList.remove('open');
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }

  /* ---------------- list rendering ---------------- */
  function renderList(){
    listEl.textContent = '';
    dishes.forEach(function(name, i){
      var li = document.createElement('li');
      li.className = 'dish';

      var dot = document.createElement('span');
      dot.className = 'swatch';
      dot.style.background = PALETTE[i % PALETTE.length].fill;

      var text = document.createElement('span');
      text.textContent = name;

      var kill = document.createElement('button');
      kill.type = 'button';
      kill.className = 'kill';
      kill.setAttribute('aria-label', 'הסרת ' + name);
      kill.textContent = '×';
      kill.addEventListener('click', function(){ remove(i); });

      li.appendChild(dot);
      li.appendChild(text);
      li.appendChild(kill);
      listEl.appendChild(li);
    });

    var n = dishes.length;
    countEl.textContent = n === 0 ? 'הגלגל ריק' : (n === 1 ? 'מנה אחת בגלגל' : n + ' מנות בגלגל');
    hint.hidden = n >= 2;
    document.querySelector('.wheel-wrap').classList.toggle('bare', n < 2);
    spinBtn.disabled = n < 2;
    $('dishInput').disabled = n >= MAX;
    $('dishInput').placeholder = n >= MAX ? 'הגלגל מלא — ' + MAX + ' מנות' : 'הוסיפו מנה — שקשוקה, פסטה…';
    draw();
  }
  function renderRecent(){
    recentEl.textContent = '';
    if(!recent.length) return;
    var b = document.createElement('b');
    b.textContent = 'אחרונים';
    var s = document.createElement('span');
    s.textContent = recent.join(' · ');
    recentEl.appendChild(b);
    recentEl.appendChild(s);
  }

  /* ---------------- mutations ---------------- */
  function add(name){
    name = name.trim().replace(/\s+/g, ' ');
    if(!name) return false;
    if(dishes.length >= MAX) return false;
    if(dishes.some(function(d){ return d === name; })) return false;
    dishes.push(name);
    winner = -1;
    save();
    renderList();
    return true;
  }
  function remove(i){
    dishes.splice(i, 1);
    winner = -1;
    save();
    renderList();
  }

  /* ---------------- wiring ---------------- */
  $('composer').addEventListener('submit', function(e){
    e.preventDefault();
    var input = $('dishInput');
    if(add(input.value)){
      input.value = '';
    }else if(input.value.trim()){
      input.select();
    }
    input.focus();
  });

  spinBtn.addEventListener('click', spin);
  canvas.addEventListener('click', spin);

  $('shuffle').addEventListener('click', function(){
    for(var i = dishes.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = dishes[i]; dishes[i] = dishes[j]; dishes[j] = tmp;
    }
    winner = -1;
    save();
    renderList();
  });

  $('restore').addEventListener('click', function(){
    STARTER.forEach(add);
  });

  $('wipe').addEventListener('click', function(){
    if(!dishes.length) return;
    if(!window.confirm('לנקות את כל המנות מהגלגל?')) return;
    dishes = [];
    winner = -1;
    save();
    renderList();
  });

  $('accept').addEventListener('click', closeSheet);
  veil.addEventListener('click', closeSheet);
  $('again').addEventListener('click', function(){
    closeSheet();
    setTimeout(spin, 260);
  });
  $('drop').addEventListener('click', function(){
    var i = winner;
    closeSheet();
    if(i > -1) remove(i);
    if(dishes.length >= 2) setTimeout(spin, 300);
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && sheet.classList.contains('open')) closeSheet();
  });

  var soundBtn = $('sound');
  soundBtn.addEventListener('click', function(){
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', String(!soundOn));
    save();
    if(soundOn) tick();
  });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 220); });

  /* redraw when the viewer flips theme, so canvas colours follow the tokens */
  new MutationObserver(function(){ probe = null; draw(); })
    .observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ probe = null; draw(); });

  /* ---------------- boot ---------------- */
  load();
  soundBtn.setAttribute('aria-pressed', String(!soundOn));
  renderRecent();
  resize();
  renderList();
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(draw); }
})();
</script>
</body>
</html>
