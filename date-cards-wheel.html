/* ---------- tokens: the sea at dusk ---------- */
:root{
  --ground:#101E26;         /* deep water after sunset */
  --raised:#182B34;
  --sunken:#0B171D;
  --line:#26404B;
  --text-1:#EEF4F3;
  --text-2:#9BB2B7;
  --text-3:#6C868D;
  --accent:#F2795B;         /* the last of the sun */
  --accent-ink:#131E23;
  --accent-soft:rgba(242,121,91,.15);
  --danger:#E0796B;
  --sheet-veil:rgba(6,15,19,.66);
  --hub-face:#F4EFE6;
  --hub-ink:#141F24;
  --rim-1:#2E4A55;
  --rim-2:#0C161B;
  --shadow-wheel:0 18px 46px rgba(0,0,0,.5);
  --seg-stroke:rgba(16,30,38,.5);
  --seg-dim:rgba(11,23,29,.62);
  --spent:rgba(11,23,29,.55);

  --display:'FrankRuhl',"Frank Ruhl Libre",'Times New Roman',serif;
  --ui:'Heebo',-apple-system,'Segoe UI','Noto Sans Hebrew','Arial Hebrew',sans-serif;

  --step--1:clamp(.72rem,.68rem + .2vw,.8rem);
  --step-0:clamp(.94rem,.9rem + .25vw,1.02rem);
  --step-1:clamp(1.06rem,.98rem + .4vw,1.2rem);
  --step-2:clamp(1.6rem,1.25rem + 1.9vw,2.3rem);
  --step-3:clamp(1.5rem,1.1rem + 2.3vw,2.2rem);
}
@media (prefers-color-scheme:light){
  :root{
    --ground:#F6F8F7;
    --raised:#FFFFFF;
    --sunken:#EDF1F0;
    --line:#DAE3E1;
    --text-1:#0F2229;
    --text-2:#4E6469;
    --text-3:#7B9196;
    --accent:#C9503A;
    --accent-ink:#FFFFFF;
    --accent-soft:rgba(201,80,58,.1);
    --danger:#B4412F;
    --sheet-veil:rgba(15,34,41,.42);
    --hub-face:#0F2229;
    --hub-ink:#F6F8F7;
    --rim-1:#EDF1F0;
    --rim-2:#BFCCCB;
    --shadow-wheel:0 16px 38px rgba(15,34,41,.16);
    --seg-stroke:rgba(255,255,255,.55);
    --seg-dim:rgba(246,248,247,.7);
    --spent:rgba(246,248,247,.66);
  }
}
:root[data-theme="light"]{
  --ground:#F6F8F7; --raised:#FFFFFF; --sunken:#EDF1F0; --line:#DAE3E1;
  --text-1:#0F2229; --text-2:#4E6469; --text-3:#7B9196;
  --accent:#C9503A; --accent-ink:#FFFFFF; --accent-soft:rgba(201,80,58,.1); --danger:#B4412F;
  --sheet-veil:rgba(15,34,41,.42); --hub-face:#0F2229; --hub-ink:#F6F8F7;

:root[data-theme="dark"]{
  --ground:#101E26; --raised:#182B34; --sunken:#0B171D; --line:#26404B;
  --text-1:#EEF4F3; --text-2:#9BB2B7; --text-3:#6C868D;
  --accent:#F2795B; --accent-ink:#131E23; --accent-soft:rgba(242,121,91,.15); --danger:#E0796B;
  --sheet-veil:rgba(6,15,19,.66); --hub-face:#F4EFE6; --hub-ink:#141F24;
  --rim-1:#2E4A55; --rim-2:#0C161B; --shadow-wheel:0 18px 46px rgba(0,0,0,.5);
  --seg-stroke:rgba(16,30,38,.5); --seg-dim:rgba(11,23,29,.62); --spent:rgba(11,23,29,.55);
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  direction:rtl;
  background:var(--ground);
  color:var(--text-1);
  font-family:var(--ui);
  font-size:var(--step-0);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  overscroll-behavior-y:none;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

.app{
  direction:rtl;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  gap:clamp(10px,2.2vw,18px);
  padding:calc(env(safe-area-inset-top) + 18px) clamp(14px,4vw,22px) calc(env(safe-area-inset-bottom) + 16px);
  max-width:560px;
  margin-inline:auto;
}

/* ---------- header ---------- */
.masthead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.eyebrow{
  font-size:var(--step--1);font-weight:700;letter-spacing:.16em;
  color:var(--text-3);margin:0 0 2px;
}
.title{
  font-family:var(--display);font-weight:800;
  font-size:var(--step-2);line-height:1.04;letter-spacing:-.01em;
  margin:0;text-wrap:balance;
}
.title em{font-style:normal;color:var(--accent)}
.ghost-btn{
  flex:none;width:38px;height:38px;border-radius:11px;
  border:1px solid var(--line);background:var(--raised);
  display:grid;place-items:center;color:var(--text-2);
  transition:color .18s,border-color .18s;
}
.ghost-btn:hover{color:var(--text-1);border-color:var(--text-3)}
.ghost-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.ghost-btn .off{display:none}
.ghost-btn[aria-pressed="true"] .on{display:none}
.ghost-btn[aria-pressed="true"] .off{display:block}

/* ---------- whose turn ---------- */
.turn{
  display:flex;align-items:center;gap:8px;
  font-size:var(--step--1);color:var(--text-3);
}
.turn > span{flex:none;letter-spacing:.1em;font-weight:700}
.player{
  flex:1;min-width:0;
  background:var(--raised);
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 14px;
  text-align:center;
  font-size:var(--step--1);font-weight:600;
  color:var(--text-2);
  transition:border-color .2s,color .2s,background .2s;
}
.player::placeholder{color:var(--text-3);font-weight:400}
.player:focus{outline:none;border-color:var(--accent);color:var(--text-1)}
.player.active{
  border-color:var(--accent);
  background:var(--accent-soft);
  color:var(--text-1);
}
.turn-swap{
  flex:none;width:34px;height:34px;border-radius:10px;
  border:1px solid var(--line);background:var(--raised);
  display:grid;place-items:center;color:var(--text-3);
  transition:color .18s,border-color .18s;
}
.turn-swap:hover{color:var(--text-1);border-color:var(--text-3)}
.turn-swap svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- wheel ---------- */
.stage{position:relative;display:grid;place-items:center;padding-block:2px}
.wheel-wrap{
  position:relative;
  width:min(86vw,392px);
  aspect-ratio:1;
  filter:drop-shadow(var(--shadow-wheel));
}
canvas#wheel{width:100%;height:100%;display:block;border-radius:50%;touch-action:manipulation}
.hub{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:28%;aspect-ratio:1;border-radius:50%;
  background:var(--hub-face);color:var(--hub-ink);
  display:grid;place-items:center;
  font-family:var(--display);font-weight:800;
  font-size:clamp(1rem,4.4vw,1.4rem);
  box-shadow:0 0 0 4px var(--ground),0 6px 18px rgba(0,0,0,.32);
  transition:transform .16s cubic-bezier(.3,1.4,.5,1),opacity .2s;
}
.hub:active{transform:translate(-50%,-50%) scale(.94)}
.hub[disabled]{opacity:.4;cursor:default}
.hub[disabled]:active{transform:translate(-50%,-50%)}
.hub small{display:block;font-family:var(--ui);font-weight:600;font-size:.46em;opacity:.55;letter-spacing:.1em;margin-top:.15em}

.peg{
  position:absolute;top:-9px;left:50%;
  width:26px;height:40px;margin-inline-start:-13px;
  transform-origin:50% 12%;
  transition:transform .13s cubic-bezier(.2,1.5,.4,1);
  pointer-events:none;z-index:2;
}
.peg svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.peg.flick{transform:rotate(-19deg)}

/* ---------- progress ---------- */
.progress{display:flex;flex-direction:column;gap:7px}
.progress-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  font-size:var(--step--1);color:var(--text-3);
}
.progress-head b{color:var(--text-2);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em;
  direction:ltr;unicode-bidi:isolate}
.bar{height:4px;border-radius:2px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .45s cubic-bezier(.22,1,.3,1)}

/* ---------- category chips ---------- */
.decks{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:7px}
.deck{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--raised);
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 12px;
  font-size:var(--step--1);
  transition:opacity .25s;
}
.deck .swatch{width:9px;height:9px;border-radius:50%;flex:none}
.deck .left{color:var(--text-3);font-variant-numeric:tabular-nums;letter-spacing:.03em;
  direction:ltr;unicode-bidi:isolate}
.deck.done{opacity:.42}
.deck.done .left{text-decoration:line-through}

.tools{display:flex;gap:16px;padding-top:2px}
.tools button{font-size:var(--step--1);color:var(--text-3);font-weight:600;padding:4px 0;transition:color .16s}
.tools button:hover{color:var(--text-1)}

/* ---------- the card ---------- */
.veil{
  position:fixed;inset:0;background:var(--sheet-veil);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .3s;z-index:20;
}
.veil.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;inset-inline:0;bottom:0;z-index:21;
  background:var(--raised);
  border-top:1px solid var(--line);
  border-radius:26px 26px 0 0;
  padding:20px clamp(18px,5vw,26px) calc(env(safe-area-inset-bottom) + 20px);
  max-width:560px;margin-inline:auto;
  transform:translateY(102%);
  transition:transform .38s cubic-bezier(.22,1,.3,1);
  box-shadow:0 -12px 40px rgba(0,0,0,.28);
}
.sheet.open{transform:translateY(0)}
.grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.card-head{
  display:flex;align-items:center;gap:8px;
  font-size:var(--step--1);font-weight:700;letter-spacing:.1em;
  color:var(--text-3);margin-bottom:12px;
}
.card-head .swatch{width:10px;height:10px;border-radius:50%;flex:none}
.card-head .who{margin-inline-start:auto;letter-spacing:0;font-weight:600;color:var(--text-2)}
.question{
  font-family:var(--display);font-weight:800;
  font-size:var(--step-3);line-height:1.24;
  margin:0;text-wrap:balance;
}
.card-rule{height:3px;width:52px;border-radius:2px;margin:16px 0 18px}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet-actions[hidden]{display:none}
.sheet-actions button{
  padding:13px 10px;border-radius:13px;font-weight:700;
  border:1px solid var(--line);color:var(--text-1);background:var(--ground);
  transition:border-color .16s,color .16s;
}
.sheet-actions button:hover{border-color:var(--text-3)}
.sheet-actions .primary{
  grid-column:1 / -1;
  background:var(--accent);color:var(--accent-ink);border-color:transparent;
}
.sheet-actions .primary:hover{filter:brightness(1.06)}
.sheet-actions .wide{grid-column:1 / -1}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.05ms !important}
}
</style>
</head>
<body>
<div class="app" dir="rtl">

  <header class="masthead">
    <div>
      <p class="eyebrow">כרטיסיות לדייט בים</p>
      <h1 class="title">תשאלו אותי <em>הכל</em></h1>
    </div>
    <button class="ghost-btn" id="sound" type="button" aria-pressed="false" aria-label="כיבוי והדלקת צליל">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9.5h3l4-3.5v12l-4-3.5H5z"/><path d="M16 9c1 .9 1 5.1 0 6"/><path d="M18.5 6.5c2.2 2 2.2 9 0 11"/></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9.5h3l4-3.5v12l-4-3.5H5z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
  </header>

  <div class="turn">
    <span>עונה</span>
    <input class="player" id="p0" maxlength="12" placeholder="אני" aria-label="שם השחקן הראשון">
    <input class="player" id="p1" maxlength="12" placeholder="את/ה" aria-label="שם השחקן השני">
    <button class="turn-swap" id="turnSwap" type="button" aria-label="החלפת תור">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h14l-3.5-3.5M20 15H6l3.5 3.5"/></svg>
    </button>
  </div>

  <div class="stage">
    <div class="wheel-wrap">
      <canvas id="wheel" role="img" aria-label="גלגל קטגוריות השאלות"></canvas>
      <div class="peg" id="peg" aria-hidden="true">
        <svg viewBox="0 0 26 40"><path d="M13 40 3 12a10 10 0 1 1 20 0z" fill="var(--accent)"/><circle cx="13" cy="11" r="3.6" fill="var(--ground)"/></svg>
      </div>
      <button class="hub" id="spin" type="button">סובב<small>שאלה</small></button>

  </div>

  <div class="progress">

  </div>

  <ul class="decks" id="decks"></ul>

  <div class="tools">
    <button type="button" id="reset">ערבוב מחדש של הכל</button>
  </div>

</div>

<div class="veil" id="veil"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="question" aria-hidden="true">
  <div class="grip"></div>
  <div class="card-head">
    <span class="swatch" id="cardSwatch"></span>
    <span id="cardDeck"></span>
    <span class="who" id="cardWho"></span>
  </div>
  <h2 class="question" id="question" aria-live="polite"></h2>
  <div class="card-rule" id="cardRule"></div>
  <div class="sheet-actions" id="cardActions">
    <button class="primary" type="button" id="next">ענינו — הבא בתור</button>
    <button class="wide" type="button" id="swap">שאלה אחרת מאותה קטגוריה</button>
  </div>
</section>

<script>

    try{
      [587.33, 739.99, 880].forEach(function(f, i){
        var t = actx.currentTime + i * 0.06;
        var osc = actx.createOscillator(), gain = actx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.55);
        osc.connect(gain).connect(actx.destination);
        osc.start(t); osc.stop(t + 0.6);
      });
    }catch(e){}
  }
  function buzz(ms){ if(navigator.vibrate){ try{ navigator.vibrate(ms); }catch(e){} } }

  /* ---------------- wheel ---------------- */
  var size = 0, R = 0, probe = null;
  function cssVar(name){
    if(!probe) probe = getComputedStyle(document.documentElement);
    return probe.getPropertyValue(name).trim() || '#888';
  }
  function uiFontStack(){
    return "'Heebo', -apple-system, 'Noto Sans Hebrew', 'Arial Hebrew', sans-serif";
  }
  function resize(){
    var rect = canvas.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    size = Math.max(rect.width, 1);
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = size / 2;
    draw();
  }
  function fit(text, maxWidth){
    if(ctx.measureText(text).width <= maxWidth) return text;
    var s = text;
    while(s.length > 1 && ctx.measureText(s + '…').width > maxWidth) s = s.slice(0, -1);
    return s + '…';
  }

  function draw(){
    ctx.clearRect(0, 0, size, size);
    var n = DECKS.length;
    var cx = R, cy = R;
    var rim = Math.max(6, R * 0.035);
    var outer = R - rim / 2;
    var seg = (Math.PI * 2) / n;
    var fontSize = Math.max(10, Math.min(R * 0.088, 20));

    ctx.textBaseline = 'middle';
    ctx.direction = 'rtl';

    for(var i = 0; i < n; i++){
      var a0 = rot + i * seg, a1 = a0 + seg;
      var d = DECKS[i];
      var spent = remaining(d) === 0;

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, outer, a0, a1);
      ctx.closePath();
      ctx.fillStyle = d.fill;
      ctx.fill();

      var g = ctx.createRadialGradient(cx, cy, outer * 0.45, cx, cy, outer);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,.16)');
      ctx.fillStyle = g;
      ctx.fill();

      ctx.lineWidth = 1.5;
      ctx.strokeStyle = cssVar('--seg-stroke');
      ctx.stroke();

      /* an emptied deck washes out; after a spin the losers step back too */
      if(spent){
        ctx.fillStyle = cssVar('--spent');
        ctx.fill();
      }else if(winner > -1 && i !== winner){
        ctx.fillStyle = cssVar('--seg-dim');
        ctx.fill();
      }

      ctx.save();
      ctx.translate(cx, cy);
      var mid = a0 + seg / 2;
      var flipped = Math.cos(mid) < 0;
      ctx.rotate(flipped ? mid + Math.PI : mid);
      ctx.fillStyle = spent ? cssVar('--text-3') : d.ink;
      if(!spent && winner > -1 && i !== winner) ctx.globalAlpha = 0.5;
      var hub = R * 0.335;
      var room = outer - hub - fontSize * 0.9;
      var fs = fontSize;
      ctx.font = '700 ' + fs.toFixed(1) + 'px ' + uiFontStack();
      while(fs > fontSize * 0.76 && ctx.measureText(d.short).width > room){
        fs -= 0.6;
        ctx.font = '700 ' + fs.toFixed(1) + 'px ' + uiFontStack();
      }
      var label = fit(d.short, room);
      if(flipped){
        ctx.textAlign = 'left';
        ctx.fillText(label, -(outer - fs * 0.8), 0);
      }else{
        ctx.textAlign = 'right';
        ctx.fillText(label, outer - fs * 0.8, 0);
      }
      ctx.restore();
    }

    var rg = ctx.createLinearGradient(0, 0, 0, size);
    rg.addColorStop(0, cssVar('--rim-1'));
    rg.addColorStop(1, cssVar('--rim-2'));
    ctx.beginPath();
    ctx.arc(cx, cy, outer, 0, Math.PI * 2);
    ctx.lineWidth = rim;
    ctx.strokeStyle = rg;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, outer - rim / 2 - 1, 0, Math.PI * 2);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(242,121,91,.45)';
    ctx.stroke();
  }

  function indexAtPointer(){
    var seg = (Math.PI * 2) / DECKS.length;
    var pointer = -Math.PI / 2;
    var rel = ((pointer - rot) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    return Math.floor(rel / seg) % DECKS.length;
  }

  function spin(){
    if(spinning) return;
    var live = liveDecks();
    if(!live.length){ finale(); return; }

    spinning = true;
    winner = -1;
    spinBtn.disabled = true;
    if(actx && actx.state === 'suspended') actx.resume();

    var seg = (Math.PI * 2) / DECKS.length;
    var pick = live[Math.floor(Math.random() * live.length)];
    var jitter = (Math.random() * 0.7 + 0.15) * seg;
    var target = -Math.PI / 2 - pick * seg - jitter;
    var turns = 5 + Math.floor(Math.random() * 3);
    var from = rot;
    var delta = turns * Math.PI * 2 + (((target - from) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    var dur = reduced ? 500 : 4000 + Math.random() * 900;
    var start = performance.now();
    var lastIdx = indexAtPointer();

    function frame(now){
      var t = Math.min((now - start) / dur, 1);
      rot = from + delta * (1 - Math.pow(1 - t, 4));
      var idx = indexAtPointer();
      if(idx !== lastIdx){
        lastIdx = idx;
        if(!reduced){
          tick();
          buzz(6);
          peg.classList.add('flick');
          setTimeout(function(){ peg.classList.remove('flick'); }, 70);
        }
      }
      draw();
      if(t < 1){
        requestAnimationFrame(frame);
      }else{
        rot = (from + delta) % (Math.PI * 2);
        spinning = false;
        spinBtn.disabled = false;
        winner = indexAtPointer();
        draw();
        deal(DECKS[winner]);
      }
    }
    requestAnimationFrame(frame);
  }

  /* ---------------- dealing a card ---------------- */
  function pickQuestion(deck, avoid){
    var left = [];
    for(var i = 0; i < deck.q.length; i++){
      if(i !== avoid && used[deck.id].indexOf(i) === -1) left.push(i);
    }
    if(!left.length) return -1;
    return left[Math.floor(Math.random() * left.length)];
  }

  function deal(deck){
    var qi = pickQuestion(deck);
    if(qi === -1){ finale(); return; }

    used[deck.id].push(qi);
    current = {deck:deck, qi:qi};

    $('cardSwatch').style.background = deck.fill;
    $('cardDeck').textContent = deck.emoji + ' ' + deck.name;
    $('cardWho').textContent = 'עונה: ' + playerName(turn);
    $('question').textContent = deck.q[qi];
    $('cardRule').style.background = deck.fill;
    $('cardActions').hidden = false;
    $('swap').hidden = remaining(deck) === 0;

    openSheet();
    buzz([0, 24, 55, 24]);
    chime();
    render();
    save();
  }

  /* swap the question but stay on the same deck — the drawn one goes back */
  function swapQuestion(){
    if(!current) return;
    var deck = current.deck;
    var idx = used[deck.id].indexOf(current.qi);
    if(idx > -1) used[deck.id].splice(idx, 1);
    var qi = pickQuestion(deck, current.qi);
    if(qi === -1){ used[deck.id].push(current.qi); return; }
    used[deck.id].push(qi);
    current.qi = qi;
    $('question').textContent = deck.q[qi];
    $('swap').hidden = remaining(deck) === 0;
    buzz(10);
    render();
    save();
  }

  function finale(){
    current = null;
    $('cardSwatch').style.background = cssVar('--accent');
    $('cardDeck').textContent = '🎉 סיבוב שלם';
    $('cardWho').textContent = '';
    $('question').textContent = 'עברתם על כל ' + TOTAL + ' השאלות. אין יותר מה לשאול — רק להזמין עוד סיבוב.';
    $('cardRule').style.background = cssVar('--accent');
    $('cardActions').hidden = true;
    openSheet();
    chime();
  }

  var lastFocus = null;
  function openSheet(){
    lastFocus = document.activeElement;
    veil.classList.add('open');
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
    setTimeout(function(){
      var btn = $('cardActions').hidden ? null : $('next');
      if(btn) btn.focus();
    }, 380);
  }
  function closeSheet(){
    veil.classList.remove('open');
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }

  /* ---------------- rendering ---------------- */
  function render(){
    var decksEl = $('decks');
    decksEl.textContent = '';
    DECKS.forEach(function(d){
      var li = document.createElement('li');
      li.className = 'deck' + (remaining(d) === 0 ? ' done' : '');

      var dot = document.createElement('span');
      dot.className = 'swatch';
      dot.style.background = d.fill;

      var label = document.createElement('span');
      label.textContent = d.emoji + ' ' + d.short;

      var left = document.createElement('span');
      left.className = 'left';
      left.textContent = remaining(d) + '/' + d.q.length;

      li.appendChild(dot);
      li.appendChild(label);
      li.appendChild(left);
      decksEl.appendChild(li);
    });

    var asked = askedCount();
    $('progressCount').textContent = asked + ' / ' + TOTAL;
    $('progressText').textContent = asked === 0
      ? 'עוד לא שאלתם כלום'
      : (asked === TOTAL ? 'סיימתם את כל הערימה' : 'שאלות שכבר עלו');
    $('progressBar').style.width = (asked / TOTAL * 100).toFixed(1) + '%';

    $('p0').classList.toggle('active', turn === 0);
    $('p1').classList.toggle('active', turn === 1);
    spinBtn.disabled = liveDecks().length === 0;
    draw();
  }

  /* ---------------- wiring ---------------- */
  spinBtn.addEventListener('click', spin);
  canvas.addEventListener('click', spin);

  $('next').addEventListener('click', function(){
    turn = turn === 0 ? 1 : 0;
    closeSheet();
    render();
    save();
  });
  $('swap').addEventListener('click', swapQuestion);
  veil.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && sheet.classList.contains('open')) closeSheet();
  });

  $('reset').addEventListener('click', function(){
    if(askedCount() && !window.confirm('להחזיר את כל ' + TOTAL + ' השאלות לערימה?')) return;
    DECKS.forEach(function(d){ used[d.id] = []; });
    winner = -1;
    render();
    save();
  });

  [0, 1].forEach(function(i){
    var el = $('p' + i);
    el.addEventListener('input', function(){
      names[i] = el.value.trim();
      save();
      if(current) $('cardWho').textContent = 'עונה: ' + playerName(turn);
    });
    el.addEventListener('focus', function(){ el.select(); });
  });

  $('turnSwap').addEventListener('click', function(){
    turn = turn === 0 ? 1 : 0;
    if(current) $('cardWho').textContent = 'עונה: ' + playerName(turn);
    render();
    save();
  });

  var soundBtn = $('sound');
  soundBtn.addEventListener('click', function(){
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', String(!soundOn));
    save();
    if(soundOn) tick();
  });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 220); });
  new MutationObserver(function(){ probe = null; draw(); })
    .observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ probe = null; draw(); });

  /* ---------------- boot ---------------- */
  load();
  $('p0').value = names[0];       /* after load, or the saved names never reach the inputs */
  $('p1').value = names[1];
  soundBtn.setAttribute('aria-pressed', String(!soundOn));
  resize();
  render();
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(draw); }
})();
</script>
</body>
</html>
