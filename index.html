<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>כניסה — דשבורד סולברג</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#1E3A5F,#2E6BA8);
     min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:#fff;border-radius:16px;padding:44px 52px;text-align:center;
     width:340px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{font-size:22px;font-weight:800;color:#1E3A5F;margin-bottom:4px}
.sub{font-size:12px;color:#999;margin-bottom:28px;line-height:1.7}
input{width:100%;padding:12px;border:2px solid #dde3ed;border-radius:10px;
      font-size:17px;text-align:center;letter-spacing:3px;outline:none;direction:ltr}
input:focus{border-color:#2E6BA8}
input.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
button{margin-top:13px;width:100%;padding:12px;background:#1E3A5F;color:#fff;
       border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s}
button:hover{background:#2E6BA8}
.err{color:#e74c3c;font-size:12px;margin-top:10px;min-height:16px;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <div class="logo">סולברג ייעוץ</div>
  <div class="sub">דשבורד בקרת לוחות זמנים<br>עיריית ירושלים</div>
  <input id="pw" type="password" placeholder="סיסמא" autocomplete="off">
  <button id="btn">כניסה</button>
  <div class="err" id="err"></div>
</div>
<script>
var pw  = document.getElementById('pw');
var btn = document.getElementById('btn');
var err = document.getElementById('err');
pw.focus();

function login() {
  if (pw.value === 'sohlberg0526') {
    sessionStorage.setItem('sbauth26', '1');
    window.location.href = 'app.html';
  } else {
    err.textContent = 'סיסמא שגויה, נסה שנית';
    pw.classList.add('shake');
    pw.value = '';
    pw.focus();
    setTimeout(function(){ err.textContent = ''; pw.classList.remove('shake'); }, 1500);
  }
}

btn.addEventListener('click', login);
pw.addEventListener('keydown', function(e){ if (e.key === 'Enter') login(); });
</script>
</body>
</html>
